replicaCount: 2

image:
  repository: kong-lab-api
  tag: v1
  pullPolicy: IfNotPresent

app:
  extraLatencyMs: 0
  errorRate: 0

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

probes:
  liveness:
    path: /healthz
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 5
    failureThreshold: 2

redis:
  image: redis:7