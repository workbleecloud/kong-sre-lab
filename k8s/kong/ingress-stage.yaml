apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: stage
  annotations:
    konghq.com/strip-path: "true"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /stage
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80