apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: prod
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: key-auth, rate-limit
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /prod
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80